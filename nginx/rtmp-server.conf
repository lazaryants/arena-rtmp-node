# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name rtmp.cricket-stream.icu;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rtmp.cricket-stream.icu;

    # SSL сертификаты (Certbot настроит автоматически)
    ssl_certificate /etc/letsencrypt/live/rtmp.cricket-stream.icu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtmp.cricket-stream.icu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    # Защита паролем для всей страницы
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Restream control panel
    location /admin {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Config page - с авторизацией
    location /config/ {
        proxy_pass http://127.0.0.1:5000/config/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        auth_basic "Config Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # Config API - с авторизацией
    location /admin/api/config/ {
        proxy_pass http://127.0.0.1:5000/api/config/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        auth_basic "Config API Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # API главной страницы — доступ только после Basic Auth
    location /api/fields {
        proxy_pass http://127.0.0.1:5000/api/config/fields;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    
    # Административный API — защищён Basic Auth
    location /admin/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        auth_basic "Admin Access";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # HLS для всех площадок (1-16)
    location ~ ^/hls/place(\d+)/(.*)$ {
        alias /var/www/hls/place$1/$2;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control no-cache;
        add_header Access-Control-Allow-Origin *;
        expires -1;
        auth_basic off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
