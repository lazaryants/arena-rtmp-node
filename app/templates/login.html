<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Arena RTMP Node</title>
    <script src="/theme.js?v=2"></script>
    <style>
        {% include 'theme.css' %}
        body { min-height: 100vh; display: grid; place-items: center; }
        .login-card { width: min(420px, calc(100% - 32px)); padding: 28px; }
        .login-card h1 { margin: 0 0 8px; }
        .login-card p { opacity: .75; margin: 0 0 24px; }
        .login-card label { display: block; margin: 14px 0 6px; }
        .login-card input {
            width: 100%; box-sizing: border-box; padding: 12px;
            border-radius: 8px; border: 1px solid #35506e;
            background: #10243d; color: white;
        }
        .login-card button { width: 100%; margin-top: 20px; }
        .login-error { color: #ff8f8f; margin-top: 14px; }
    </style>
</head>
<body>
    <main class="panel login-card">
        <h1>Arena RTMP Node</h1>
        <p>Sign in to stream management</p>
        <form method="post">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>
            <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    </main>
</body>
</html>
