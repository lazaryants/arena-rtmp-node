<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena RTMP Node — Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
    <script src="/theme.js?v=3"></script>
    <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">🏐</span>
            <div class="brand-copy">
                <div class="brand-title">Arena RTMP Node</div>
                <div class="brand-subtitle">Receiving and distribution server</div>
            </div>
        </div>
        <div class="topbar-actions">
            <nav class="nav-menu" aria-label="Main navigation">
                <a href="/" class="active">Monitoring</a>
                <a href="/config/"
                   id="configurationNavLink"
                   data-minimum-role="admin"
                   hidden>Configuration</a>
                <a href="/admin/"
                   id="restreamNavLink"
                   data-minimum-role="operator"
                   hidden>Restreams</a>
                <a href="/admin/users/"
                   id="usersNavLink"
                   data-minimum-role="admin"
                   hidden>Users</a>
                <a href="/admin/audit/"
                   id="auditNavLink"
                   data-minimum-role="admin"
                   hidden>Audit</a>
            </nav>
            <div class="account-slot">
                <span class="account-identity"
                      id="accountIdentity"
                      hidden></span>
                <a class="account-action"
                   href="/admin/login?next=/"
                   id="signInNavLink">Sign in</a>
                <form action="/admin/logout"
                      method="post"
                      id="accountLogoutForm"
                      hidden>
                    <input type="hidden"
                           name="csrf_token"
                           id="accountCsrfToken">
                    <button class="account-action"
                            type="submit">Logout</button>
                </form>
            </div>
        </div>
    </header>

    <main>
        <div class="page-heading">
            <div>
                <h1>Live cameras Arena76</h1>
            </div>
            <div class="heading-actions">
                <button class="details-toggle"
                        id="detailsToggle"
                        type="button"
                        aria-pressed="false">Hide details</button>
                <span class="page-badge">System online</span>
                <div class="layout-switcher" aria-label="Cards per row">
                    <span>Columns</span>
                    <button type="button" data-columns="2">2</button>
                    <button type="button" data-columns="3">3</button>
                    <button type="button" data-columns="4">4</button>
                </div>
            </div>
        </div>
    <div class="grid" id="streamsGrid">
        <div class="loading-state">
            Loading streams...
        </div>
    </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="script.js?v=10"></script>
</body>
</html>
